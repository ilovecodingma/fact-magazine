# 매일 자동 갱신: 수집 -> 묶기 -> 빌드만 합니다. 확인 노트를 쓰는 일은 자동으로 하지 않습니다.
name: daily
on:
  schedule:
    - cron: '0 21 * * *'   # 한국시간 매일 06:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}   # 있을 때만 Cloudflare Pages 에 올립니다(저장소 Settings > Secrets). 파일에는 값을 쓰지 않습니다
      # 공개 주소와 base 는 저장소 변수(SITE_URL, SITE_BASE)가 있을 때만 site.json 을 덮어씁니다. 기본은 Vercel(주소 맨 위, base "/")
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_BASE: ${{ vars.SITE_BASE }}
      # 아래는 저장소 설정 > Variables 에 값을 넣으면 site.json 대신 쓰입니다(없으면 site.json 값)
      SITE_NAME: ${{ vars.SITE_NAME }}
      SITE_TAGLINE: ${{ vars.SITE_TAGLINE }}
      SITE_CONTACT: ${{ vars.SITE_CONTACT }}
      HOME_TITLE: ${{ vars.HOME_TITLE }}
      HOME_DESC: ${{ vars.HOME_DESC }}
      SITE_ABOUT: ${{ vars.SITE_ABOUT }}
      TOPIC_KEYWORDS: ${{ vars.TOPIC_KEYWORDS }}
      MIN_SOURCES: ${{ vars.MIN_SOURCES }}
      PARTS: ${{ vars.PARTS }}   # 부품 켜기·끄기(JSON 글자). 없으면 site.json 의 parts
      GAMES_TITLE: ${{ vars.GAMES_TITLE }}
      GAMES_DESC: ${{ vars.GAMES_DESC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python collect.py
      - run: python group.py
      - run: python build.py
      - name: 바뀐 것이 있으면 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "자동 갱신 $(date +%F)" && git push
      - name: Cloudflare Pages 로 올리기(Secrets 에 CLOUDFLARE_API_TOKEN·CLOUDFLARE_ACCOUNT_ID 와 변수 CF_PAGES_PROJECT 가 있을 때만)
        if: ${{ env.CF_TOKEN != '' && vars.CF_PAGES_PROJECT != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_EXTRAS: ${{ vars.SITE_EXTRAS }}   # 쿠팡·유튜브·블로그 같은 내 값(JSON 글자). 저장소에 올라가는 docs/ 에는 넣지 않고 배포본(dist/)에만 넣습니다
          OUT_DIR: dist
        run: |
          python build.py
          npx --yes wrangler@4 pages deploy dist --project-name "${{ vars.CF_PAGES_PROJECT }}" --branch main --commit-dirty=true
