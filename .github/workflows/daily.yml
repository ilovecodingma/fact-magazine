# 매일 자동 갱신: 수집 -> 묶기 -> 빌드만 합니다. 확인 노트를 쓰는 일은 자동으로 하지 않습니다.
name: daily
on:
  schedule:
    - cron: '0 21 * * *'   # 한국시간 매일 06:00
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python collect.py
      - run: python group.py
      - run: python build.py
      - name: 바뀐 것이 있으면 커밋
        run: |
          git config user.name "daily-bot"
          git config user.email "daily-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "자동 갱신 $(date +%F)" && git push
