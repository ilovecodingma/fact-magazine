# python run.py 서버 가 이 파일로 `docker compose up -d --build` 를 부릅니다.
# 포트는 127.0.0.1(내 PC 안)에서만 엽니다. 바깥에 열 때 지킬 것은 올리기.md 를 보세요.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?먼저 python run.py 서버 로 켜세요(.env 를 만들어 줍니다)}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data      # 자료는 이 볼륨에 쌓입니다(상자를 지워도 남음)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD}@db:5432/app
    volumes:
      - ./site_local:/site:ro                # python run.py 서버 가 찍어 둔 사이트(읽기 전용)
      - ./data/app:/data                     # 운영자 암호 해시(admin.json)와 기록
    ports:
      - "127.0.0.1:8080:8080"
volumes:
  pgdata:
