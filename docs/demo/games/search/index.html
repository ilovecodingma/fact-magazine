<main class="wrap"><div class="page"><span class="lb">검색</span><h1>사이트 안 검색</h1><input id="q" type="search" placeholder="찾을 글자" autofocus style="font:18px var(--sans);padding:12px;width:100%;border:2px solid var(--ink)"><div id="o" style="margin-top:16px"></div></div><script>(function(){var q=document.getElementById("q"),o=document.getElementById("o"),D=[];fetch("/fact-magazine/demo/games/search.json").then(function(r){return r.json()}).then(function(d){D=d;go()}).catch(function(){o.textContent="검색 색인을 불러오지 못했습니다."});function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}function go(){var t=q.value.trim().toLowerCase();if(!t){o.innerHTML="<p class=\"mu\">찾을 글자를 입력하세요. 쪽 "+D.length+"개에서 찾습니다.</p>";return}var w=t.split(/\s+/),r=[];D.forEach(function(p){var h=(p[1]+" "+p[2]).toLowerCase(),s=0;for(var i=0;i<w.length;i++){if(h.indexOf(w[i])<0){s=-1;break}s+=p[1].toLowerCase().indexOf(w[i])>=0?3:1}if(s>0)r.push([s,p])});r.sort(function(a,b){return b[0]-a[0]});o.innerHTML=r.length?r.slice(0,30).map(function(x){return "<div class=\"tp\"><b><a href=\""+x[1][0]+"\">"+esc(x[1][1])+"</a></b><span class=\"ln\">"+esc(x[1][2].slice(0,90))+"</span></div>"}).join(""):"<p class=\"mu\">찾는 글이 없습니다.</p>"}q.addEventListener("input",go);var m=location.search.match(/[?&]q=([^&]*)/);if(m){try{q.value=decodeURIComponent(m[1])}catch(e){}}})()</script></main>
<footer><div class="wrap"><a href="/fact-magazine/demo/games/privacy/">개인정보 처리방침</a><p>기사 본문은 싣지 않고 제목·매체·시각·링크만 모아 보여 줍니다. 기사의 저작권은 각 매체에 있습니다.</p></div></footer></body></html>
