<main class="wrap"><div class="page"><span class="lb">퀴즈</span><h1>게임놀이터 상식 퀴즈</h1><p class="dek">10문제로 머리를 깨워 보세요. 정답과 한 줄 설명까지 바로 확인할 수 있습니다. 결과는 이 브라우저에만 저장됩니다.</p><div id="qz"></div><script>(function(){var Q=[{"q": "1기압에서 물이 끓는 온도는 섭씨 몇 도일까요?", "options": ["90도", "95도", "100도", "105도"], "answer": 2, "explain": "1기압에서 순수한 물의 끓는점은 100도입니다."}, {"q": "태양계에서 가장 큰 행성은 무엇일까요?", "options": ["목성", "토성", "지구", "해왕성"], "answer": 0, "explain": "목성은 태양계 행성 중 크기와 질량이 가장 큽니다."}, {"q": "지구에서 면적이 가장 넓은 바다(대양)는 무엇일까요?", "options": ["대서양", "인도양", "북극해", "태평양"], "answer": 3, "explain": "태평양은 지구 전체 바다 중 가장 넓습니다."}, {"q": "12 × 12 의 값은 얼마일까요?", "options": ["124", "144", "132", "154"], "answer": 1, "explain": "12 × 12 = 144 입니다."}, {"q": "식물이 광합성을 할 때 공기 중에서 흡수하는 기체는 무엇일까요?", "options": ["산소", "이산화탄소", "질소", "수소"], "answer": 1, "explain": "식물은 이산화탄소와 물, 빛으로 양분을 만듭니다."}, {"q": "이탈리아의 수도는 어디일까요?", "options": ["밀라노", "나폴리", "베네치아", "로마"], "answer": 3, "explain": "이탈리아의 수도는 로마입니다."}, {"q": "삼각형의 세 내각을 모두 더하면 몇 도일까요?", "options": ["180도", "90도", "270도", "360도"], "answer": 0, "explain": "평면 위 삼각형의 내각의 합은 항상 180도입니다."}, {"q": "인류가 처음으로 달에 착륙한 해는 언제일까요?", "options": ["1959년", "1965년", "1969년", "1975년"], "answer": 2, "explain": "1969년 아폴로 11호가 처음으로 사람을 달에 내려놓았습니다."}, {"q": "소수(1과 자기 자신으로만 나누어지는 1보다 큰 수) 중 유일한 짝수는 무엇일까요?", "options": ["4", "6", "8", "2"], "answer": 3, "explain": "2를 제외한 짝수는 모두 2로 나누어져 소수가 아닙니다."}, {"q": "상온(약 20도)에서 액체 상태인 금속은 무엇일까요?", "options": ["수은", "철", "구리", "알루미늄"], "answer": 0, "explain": "수은은 상온에서 액체로 존재하는 대표적인 금속입니다."}],box=document.getElementById("qz"),k="fm_quiz_best";var h="";Q.forEach(function(q,i){h+="<div class=\"tp\"><b>"+(i+1)+". "+q.q+"</b>";q.options.forEach(function(o,j){h+="<label style=\"display:block;font:15px var(--sans);margin:6px 0\"><input type=\"radio\" name=\"q"+i+"\" value=\""+j+"\" style=\"width:auto;margin-right:8px\">"+o+"</label>"});h+="<div class=\"ex\" id=\"x"+i+"\" style=\"display:none;font:14px var(--sans);color:#444\"></div></div>"});h+="<button type=\"button\" id=\"go\" style=\"font:700 16px var(--sans);padding:10px 20px;border:2px solid #111;background:#111;color:#fff;cursor:pointer;width:auto\">채점하기</button><p id=\"rs\" style=\"font:700 18px var(--serif)\"></p>";box.innerHTML=h;document.getElementById("go").onclick=function(){var s=0;Q.forEach(function(q,i){var c=document.querySelector("input[name=q"+i+"]:checked"),x=document.getElementById("x"+i);x.style.display="block";if(c&&+c.value===q.answer){s++;x.textContent="맞았습니다. "+q.explain}else{x.textContent="정답은 「"+q.options[q.answer]+"」. "+q.explain}});var m="";try{var b=+localStorage.getItem(k)||0;if(s>b){localStorage.setItem(k,s);b=s}m=" (이 브라우저의 최고 "+b+"점)"}catch(e){}document.getElementById("rs").textContent=s+" / "+Q.length+"점"+m}})()</script></div></main>
