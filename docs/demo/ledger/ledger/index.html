<main class="wrap"><div class="page"><span class="lb">가계부</span><h1>가계부 표</h1><style>.lf{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:0 0 12px}.lf input{font:15px var(--sans);padding:8px;border:1px solid #111}</style><div class="lf"><input id="ld" type="date"><input id="lc" placeholder="분류(식비…)"><input id="lm" placeholder="내용"><input id="lam" type="number" placeholder="금액(원)" inputmode="decimal"></div><p><button type="button" id="la" style="width:auto;padding:8px 18px;margin:0 8px 0 0;border:2px solid #111;background:#111;color:#fff;cursor:pointer;font:700 15px var(--sans)">추가</button><button type="button" id="lx" style="width:auto;padding:8px 14px;margin:0 8px 0 0;border:1px solid #111;background:#fff;cursor:pointer;font:600 14px var(--sans)">CSV 내보내기</button><button type="button" id="lr" style="width:auto;padding:8px 14px;margin:0;border:1px solid #999;background:#fff;cursor:pointer;font:600 14px var(--sans)">모두 지우기</button></p><div style="overflow-x:auto"><table class="mdt" id="lt" style="width:100%"></table></div><p id="ls" style="font:15px var(--sans)"></p><p class="ad-nt">입력한 내용은 <b>이 브라우저에만</b> 저장됩니다(다른 기기·다른 사람과 공유되지 않음). 지우거나 브라우저 데이터를 정리하면 사라지니 중요한 것은 「CSV 내보내기」로 따로 저장하세요.</p><script>(function(){var k="fm_ledger",R=[];try{R=JSON.parse(localStorage.getItem(k)||"[]")}catch(e){}var t=document.getElementById("lt"),s=document.getElementById("ls");function save(){try{localStorage.setItem(k,JSON.stringify(R))}catch(e){}}function draw(){var h="<tr><th>날짜</th><th>분류</th><th>내용</th><th>금액</th><th></th></tr>",sum={},tot=0;R.forEach(function(r,i){h+="<tr><td>"+r.d+"</td><td>"+r.c+"</td><td>"+r.m+"</td><td style=\"text-align:right\">"+r.a.toLocaleString("ko-KR")+"</td><td><button type=\"button\" data-i=\""+i+"\" style=\"width:auto;padding:2px 8px;margin:0\">삭제</button></td></tr>";sum[r.c]=(sum[r.c]||0)+r.a;tot+=r.a});t.innerHTML=h;var x="<b>합계 "+tot.toLocaleString("ko-KR")+"원</b>";Object.keys(sum).forEach(function(c){x+=" · "+c+" "+sum[c].toLocaleString("ko-KR")+"원"});s.innerHTML=x;t.querySelectorAll("button").forEach(function(b){b.onclick=function(){R.splice(+b.dataset.i,1);save();draw()}})}document.getElementById("la").onclick=function(){var a=parseFloat(document.getElementById("lam").value);if(!a)return;R.push({d:document.getElementById("ld").value||new Date().toISOString().slice(0,10),c:document.getElementById("lc").value||"기타",m:document.getElementById("lm").value||"-",a:a});save();draw();document.getElementById("lam").value=""};document.getElementById("lx").onclick=function(){var c="\ufeff날짜,분류,내용,금액\n"+R.map(function(r){return [r.d,r.c,r.m,r.a].join(",")}).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([c],{type:"text/csv"}));a.download="가계부.csv";a.click()};document.getElementById("lr").onclick=function(){if(R.length&&confirm("저장된 내용을 모두 지울까요?")){R=[];save();draw()}};draw()})()</script></div></main>
<footer><div class="wrap"><a href="/fact-magazine/demo/ledger/privacy/">개인정보 처리방침</a><a href="/fact-magazine/demo/ledger/app/">앱으로 쓰기</a><a href="/fact-magazine/demo/ledger/dday/">디데이</a><a href="/fact-magazine/demo/ledger/ledger/">가계부</a><p class="prefs">보기 설정: <button type="button" data-fz="-0.1">글자 작게</button><button type="button" data-fz="0.1">글자 크게</button><button type="button" data-th="1">어두운 바탕 켜기/끄기</button></p><script>(function(){var d=document.documentElement;document.querySelectorAll(".prefs button").forEach(function(b){b.onclick=function(){try{if(b.dataset.th){var t=d.getAttribute("data-theme")==="dark"?"light":"dark";d.setAttribute("data-theme",t);localStorage.setItem("fm_theme",t)}else{var z=Math.max(.8,Math.min(1.5,(parseFloat(d.style.getPropertyValue("--fz"))||1)+parseFloat(b.dataset.fz)));d.style.setProperty("--fz",z);localStorage.setItem("fm_fz",z)}}catch(e){}}})})()</script></div></footer><script>if("serviceWorker" in navigator){navigator.serviceWorker.register("/fact-magazine/demo/ledger/sw.js",{scope:"/fact-magazine/demo/ledger/"}).catch(function(){})}</script></body></html>
