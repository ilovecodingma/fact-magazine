<main class="wrap"><div class="page"><span class="lb">퀴즈</span><h1>걷기 모임 퀴즈(예시)</h1><p class="dek">가볍게 풀어 보는 예시 퀴즈입니다. 결과는 이 브라우저에만 저장됩니다.</p><div id="qz"></div><script>(function(){var Q=[{"q": "걸을 때 가장 먼저 챙길 것은?", "options": ["편한 신발", "무거운 가방", "큰 우산"], "answer": 0, "explain": "오래 걸으려면 편한 신발이 가장 중요합니다."}, {"q": "걷다가 힘들면?", "options": ["참고 계속 걷기", "쉬었다 가기", "뛰기"], "answer": 1, "explain": "힘들면 쉬었다 가는 것이 좋습니다."}],box=document.getElementById("qz"),k="fm_quiz_best";var h="";Q.forEach(function(q,i){h+="<div class=\"tp\"><b>"+(i+1)+". "+q.q+"</b>";q.options.forEach(function(o,j){h+="<label style=\"display:block;font:15px var(--sans);margin:6px 0\"><input type=\"radio\" name=\"q"+i+"\" value=\""+j+"\" style=\"width:auto;margin-right:8px\">"+o+"</label>"});h+="<div class=\"ex\" id=\"x"+i+"\" style=\"display:none;font:14px var(--sans);color:#444\"></div></div>"});h+="<button type=\"button\" id=\"go\" style=\"font:700 16px var(--sans);padding:10px 20px;border:2px solid #111;background:#111;color:#fff;cursor:pointer;width:auto\">채점하기</button><p id=\"rs\" style=\"font:700 18px var(--serif)\"></p>";box.innerHTML=h;document.getElementById("go").onclick=function(){var s=0;Q.forEach(function(q,i){var c=document.querySelector("input[name=q"+i+"]:checked"),x=document.getElementById("x"+i);x.style.display="block";if(c&&+c.value===q.answer){s++;x.textContent="맞았습니다. "+q.explain}else{x.textContent="정답은 「"+q.options[q.answer]+"」. "+q.explain}});var m="";try{var b=+localStorage.getItem(k)||0;if(s>b){localStorage.setItem(k,s);b=s}m=" (이 브라우저의 최고 "+b+"점)"}catch(e){}document.getElementById("rs").textContent=s+" / "+Q.length+"점"+m}})()</script></div></main>
