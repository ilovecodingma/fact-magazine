<main class="wrap"><article class="art"><span class="lb">위키</span><h1>조리개</h1><p>조리개는 렌즈 안에서 빛이 지나가는 구멍의 크기입니다. 숫자는 f/1.8, f/8처럼 표시하며 숫자가 작을수록 구멍이 커서 빛이 많이 들어옵니다. 구멍이 크면 배경이 흐려지고 피사체가 돋보입니다. 반대로 구멍을 줄이면 앞뒤가 모두 또렷해져 풍경 사진에 알맞습니다. 이렇게 초점이 맞는 범위를 피사계 심도라고 부릅니다.</p><div class="by"><a href="/fact-magazine/demo/study/wiki/">위키 목록</a></div></article></main>
