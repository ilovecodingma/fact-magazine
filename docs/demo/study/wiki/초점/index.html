<main class="wrap"><article class="art"><span class="lb">위키</span><h1>초점</h1><p>초점은 사진에서 가장 또렷하게 보이길 원하는 지점을 정하는 일입니다. 인물 사진에서는 눈에 초점을 맞추는 것이 기본입니다. 셔터 버튼을 반쯤 누르면 초점이 맞고, 끝까지 누르면 촬영되는 카메라가 많습니다. 움직이는 대상에는 연속으로 초점을 따라가는 모드를 사용합니다. 초점이 어긋났다면 조리개 값과 거리도 함께 확인해 보세요.</p><div class="by"><a href="/fact-magazine/demo/study/wiki/">위키 목록</a></div></article></main>
