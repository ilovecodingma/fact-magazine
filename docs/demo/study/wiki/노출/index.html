<main class="wrap"><article class="art"><span class="lb">위키</span><h1>노출</h1><p>노출은 사진 센서가 받아들이는 빛의 양을 말합니다. 빛이 너무 많으면 사진이 하얗게 날아가고, 너무 적으면 어둡게 나옵니다. 노출은 조리개, 셔터 속도, ISO 세 가지가 함께 정합니다. 세 값은 서로 보완 관계라서 하나를 바꾸면 다른 하나를 맞춰 줘야 합니다. 먼저 이 균형을 이해하면 어떤 카메라든 쉽게 다룰 수 있습니다.</p><div class="by"><a href="/fact-magazine/demo/study/wiki/">위키 목록</a></div></article></main>
