<main class="wrap"><article class="art"><span class="lb">위키</span><h1>셔터 속도</h1><p>셔터 속도는 센서가 빛을 받는 시간의 길이입니다. 1/1000초처럼 짧으면 움직이는 대상을 멈춘 듯 또렷하게 담습니다. 1/4초처럼 길면 물이나 차량의 움직임이 선처럼 흐르게 표현됩니다. 손으로 들고 찍을 때는 너무 느린 속도에서 손떨림이 생기기 쉽습니다. 어두운 곳에서는 삼각대를 쓰면 느린 셔터도 안정적으로 쓸 수 있습니다.</p><div class="by"><a href="/fact-magazine/demo/study/wiki/">위키 목록</a></div></article></main>
