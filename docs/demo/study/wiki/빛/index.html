<main class="wrap"><article class="art"><span class="lb">위키</span><h1>빛</h1><p>사진은 결국 빛을 기록하는 일입니다. 해가 뜨고 지는 무렵의 빛은 부드럽고 따뜻해서 인물과 풍경이 모두 예쁘게 나옵니다. 한낮의 직사광선은 그림자가 짙어 대비가 강해집니다. 흐린 날은 빛이 고르게 퍼져 피부 표현이 부드럽습니다. 빛이 오는 방향이 정면인지, 옆인지, 뒤인지에 따라 분위기가 크게 달라집니다.</p><div class="by"><a href="/fact-magazine/demo/study/wiki/">위키 목록</a></div></article></main>
