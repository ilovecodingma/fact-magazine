<main class="wrap"><div class="page"><span class="lb">퀴즈</span><h1>사진 기초 퀴즈</h1><p class="dek">공부한 것을 확인합니다. 결과는 이 브라우저에만 저장됩니다.</p><div id="qz"></div><script>(function(){var Q=[{"q": "조리개 값 f/1.8과 f/8 중 구멍이 더 큰 쪽은?", "options": ["f/1.8", "f/8", "같다", "알 수 없다"], "answer": 0, "explain": "f값이 작을수록 구멍이 큽니다."}, {"q": "움직이는 대상을 멈춘 듯 찍으려면 어떤 셔터 속도가 알맞은가?", "options": ["1/4초", "1초", "1/1000초", "30초"], "answer": 2, "explain": "짧은 셔터 속도가 움직임을 멈춰 줍니다."}, {"q": "ISO 값을 크게 올렸을 때 흔히 늘어나는 것은?", "options": ["노이즈", "화각", "초점거리", "렌즈 무게"], "answer": 0, "explain": "높은 ISO는 화면의 노이즈를 늘립니다."}, {"q": "배경을 더 흐리게 하는 데 도움이 되는 설정은?", "options": ["조리개를 더 조인다", "조리개를 더 연다", "ISO를 낮춘다", "삼각대를 쓴다"], "answer": 1, "explain": "조리개를 열면 피사계 심도가 얕아집니다."}, {"q": "화면을 가로세로 셋으로 나눠 구성하는 방법은?", "options": ["대각선 구도", "3분할 구도", "원형 구도", "무작위 구도"], "answer": 1, "explain": "3분할 구도의 정의입니다."}, {"q": "전구 아래에서 사진이 노랗게 보이는 현상을 바로잡는 설정은?", "options": ["화이트 밸런스", "셔터 속도", "피사계 심도", "연사"], "answer": 0, "explain": "화이트 밸런스는 빛의 색을 보정합니다."}, {"q": "노출을 결정하는 세 가지 요소가 아닌 것은?", "options": ["조리개", "셔터 속도", "ISO", "파일 이름"], "answer": 3, "explain": "파일 이름은 노출과 무관합니다."}, {"q": "인물 사진에서 초점을 맞추는 기본 위치는?", "options": ["발끝", "눈", "배경 나무", "옷 단추"], "answer": 1, "explain": "인물은 눈에 초점을 맞추는 것이 기본입니다."}],box=document.getElementById("qz"),k="fm_quiz_best";var h="";Q.forEach(function(q,i){h+="<div class=\"tp\"><b>"+(i+1)+". "+q.q+"</b>";q.options.forEach(function(o,j){h+="<label style=\"display:block;font:15px var(--sans);margin:6px 0\"><input type=\"radio\" name=\"q"+i+"\" value=\""+j+"\" style=\"width:auto;margin-right:8px\">"+o+"</label>"});h+="<div class=\"ex\" id=\"x"+i+"\" style=\"display:none;font:14px var(--sans);color:#444\"></div></div>"});h+="<button type=\"button\" id=\"go\" style=\"font:700 16px var(--sans);padding:10px 20px;border:2px solid #111;background:#111;color:#fff;cursor:pointer;width:auto\">채점하기</button><p id=\"rs\" style=\"font:700 18px var(--serif)\"></p>";box.innerHTML=h;document.getElementById("go").onclick=function(){var s=0;Q.forEach(function(q,i){var c=document.querySelector("input[name=q"+i+"]:checked"),x=document.getElementById("x"+i);x.style.display="block";if(c&&+c.value===q.answer){s++;x.textContent="맞았습니다. "+q.explain}else{x.textContent="정답은 「"+q.options[q.answer]+"」. "+q.explain}});var m="";try{var b=+localStorage.getItem(k)||0;if(s>b){localStorage.setItem(k,s);b=s}m=" (이 브라우저의 최고 "+b+"점)"}catch(e){}document.getElementById("rs").textContent=s+" / "+Q.length+"점"+m}})()</script></div></main>
