<main class="wrap"><div class="page"><span class="lb">퀴즈</span><h1>공부법 퀴즈(예시)</h1><p class="dek">예시 퀴즈입니다. 결과는 이 브라우저에만 저장됩니다.</p><div id="qz"></div><script>(function(){var Q=[{"q": "복습은 언제 하면 좋을까요?", "options": ["배운 뒤 조금 지나서", "시험 전날 한 번만", "하지 않는다"], "answer": 0, "explain": "배운 뒤 얼마 지나지 않아 다시 보면 기억에 오래 남습니다."}, {"q": "요약 노트는 어떻게 쓰나요?", "options": ["책을 그대로 베낀다", "내 말로 짧게 쓴다", "쓰지 않는다"], "answer": 1, "explain": "내 말로 짧게 쓰면 이해한 정도를 알 수 있습니다."}],box=document.getElementById("qz"),k="fm_quiz_best";var h="";Q.forEach(function(q,i){h+="<div class=\"tp\"><b>"+(i+1)+". "+q.q+"</b>";q.options.forEach(function(o,j){h+="<label style=\"display:block;font:15px var(--sans);margin:6px 0\"><input type=\"radio\" name=\"q"+i+"\" value=\""+j+"\" style=\"width:auto;margin-right:8px\">"+o+"</label>"});h+="<div class=\"ex\" id=\"x"+i+"\" style=\"display:none;font:14px var(--sans);color:#444\"></div></div>"});h+="<button type=\"button\" id=\"go\" style=\"font:700 16px var(--sans);padding:10px 20px;border:2px solid #111;background:#111;color:#fff;cursor:pointer;width:auto\">채점하기</button><p id=\"rs\" style=\"font:700 18px var(--serif)\"></p>";box.innerHTML=h;document.getElementById("go").onclick=function(){var s=0;Q.forEach(function(q,i){var c=document.querySelector("input[name=q"+i+"]:checked"),x=document.getElementById("x"+i);x.style.display="block";if(c&&+c.value===q.answer){s++;x.textContent="맞았습니다. "+q.explain}else{x.textContent="정답은 「"+q.options[q.answer]+"」. "+q.explain}});var m="";try{var b=+localStorage.getItem(k)||0;if(s>b){localStorage.setItem(k,s);b=s}m=" (이 브라우저의 최고 "+b+"점)"}catch(e){}document.getElementById("rs").textContent=s+" / "+Q.length+"점"+m}})()</script></div></main>
