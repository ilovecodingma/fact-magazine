<main class="wrap"><article class="art"><span class="lb">계산기</span><h1>더치페이 계산기</h1><p class="dek">총 금액을 인원수로 똑같이 나눕니다(예시).</p><div class="calc"><label for="i_total">총 금액 (원)</label><input id="i_total" type="number" inputmode="decimal" step="any" value="84000"><label for="i_n">인원 수 (명)</label><input id="i_n" type="number" inputmode="decimal" step="any" value="4"></div><div id="cr" class="crs"></div><p class="ad-nt">나누어떨어지지 않으면 올림해서 한 명이 조금 더 낼 수 있습니다.</p></article><script>(function(){var C={"inputs": ["total", "n"], "vars": [], "results": [{"label": "1인당 금액", "format": "won", "expr": "total/n"}]};function f(e,x){return new Function("v","with(v){return ("+e+")}")(x)}function fmt(n,k){if(!isFinite(n))return "계산할 수 없음";if(k=="won")return Math.round(n).toLocaleString("ko-KR")+"원";if(k=="pct")return (Math.round(n*100)/100)+"%";return (Math.round(n*100)/100).toLocaleString("ko-KR")}function run(){var v={Math:Math};C.inputs.forEach(function(i){v[i]=parseFloat(document.getElementById("i_"+i).value)||0});C.vars.forEach(function(x){v[x.id]=f(x.expr,v)});var h="";C.results.forEach(function(r){h+="<div class=\"cr\"><span>"+r.label+"</span><b>"+fmt(f(r.expr,v),r.format)+"</b></div>"});document.getElementById("cr").innerHTML=h}document.querySelectorAll(".calc input").forEach(function(i){i.addEventListener("input",run)});run()})()</script></main>
