<main class="wrap"><article class="art"><span class="lb">계산기</span><h1>저축 목표 계산기</h1><p class="dek">목표 금액을 정한 기간 안에 모으려면 매달 얼마를 저축해야 하는지 계산합니다.</p><div class="calc"><label for="i_goal">목표 금액 (원)</label><input id="i_goal" type="number" inputmode="decimal" step="any" value="12000000"><label for="i_months">기간 (개월)</label><input id="i_months" type="number" inputmode="decimal" step="any" value="24"><label for="i_rate">연 이자율(세전) (%)</label><input id="i_rate" type="number" inputmode="decimal" step="any" value="3"></div><div id="cr" class="crs"></div><p class="ad-nt">매달 말에 같은 금액을 넣고 월 복리로 계산한 참고용 결과입니다. 이자소득세·상품별 조건은 반영하지 않았습니다.</p></article><script>(function(){var C={"inputs": ["goal", "months", "rate"], "vars": [{"id": "r", "expr": "rate/100/12"}], "results": [{"label": "매달 저축할 금액", "format": "won", "expr": "r==0 ? goal/months : goal*r/(Math.pow(1+r,months)-1)"}, {"label": "원금 합계", "format": "won", "expr": "(r==0 ? goal/months : goal*r/(Math.pow(1+r,months)-1))*months"}, {"label": "이자로 채우는 금액(세전)", "format": "won", "expr": "goal-(r==0 ? goal : goal*r/(Math.pow(1+r,months)-1)*months)"}]};function f(e,x){return new Function("v","with(v){return ("+e+")}")(x)}function fmt(n,k){if(!isFinite(n))return "계산할 수 없음";if(k=="won")return Math.round(n).toLocaleString("ko-KR")+"원";if(k=="pct")return (Math.round(n*100)/100)+"%";return (Math.round(n*100)/100).toLocaleString("ko-KR")}function run(){var v={Math:Math};C.inputs.forEach(function(i){v[i]=parseFloat(document.getElementById("i_"+i).value)||0});C.vars.forEach(function(x){v[x.id]=f(x.expr,v)});var h="";C.results.forEach(function(r){h+="<div class=\"cr\"><span>"+r.label+"</span><b>"+fmt(f(r.expr,v),r.format)+"</b></div>"});document.getElementById("cr").innerHTML=h}document.querySelectorAll(".calc input").forEach(function(i){i.addEventListener("input",run)});run()})()</script></main>
<footer><div class="wrap"><a href="/fact-magazine/demo/tools/privacy/">개인정보 처리방침</a><a href="/fact-magazine/demo/tools/status/">상태</a><p>기사 본문은 싣지 않고 제목·매체·시각·링크만 모아 보여 줍니다. 기사의 저작권은 각 매체에 있습니다.</p></div></footer></body></html>
