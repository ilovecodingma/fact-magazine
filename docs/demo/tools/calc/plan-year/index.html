<main class="wrap"><article class="art"><span class="lb">계산기</span><h1>요금제 연간 비용 계산기</h1><p class="dek">월 요금으로 1년 비용을 미리 봅니다(가상 요금, 예시).</p><div class="calc"><label for="i_fee">월 요금 (원)</label><input id="i_fee" type="number" inputmode="decimal" step="any" value="9900"><label for="i_m">개월 수 (개월)</label><input id="i_m" type="number" inputmode="decimal" step="any" value="12"></div><div id="cr" class="crs"></div><p class="ad-nt">월 요금 × 개월 수입니다. 할인·세금은 반영하지 않았습니다.</p></article><script>(function(){var C={"inputs": ["fee", "m"], "vars": [], "results": [{"label": "기간 총 비용", "format": "won", "expr": "fee*m"}]};function f(e,x){return new Function("v","with(v){return ("+e+")}")(x)}function fmt(n,k){if(!isFinite(n))return "계산할 수 없음";if(k=="won")return Math.round(n).toLocaleString("ko-KR")+"원";if(k=="pct")return (Math.round(n*100)/100)+"%";return (Math.round(n*100)/100).toLocaleString("ko-KR")}function run(){var v={Math:Math};C.inputs.forEach(function(i){v[i]=parseFloat(document.getElementById("i_"+i).value)||0});C.vars.forEach(function(x){v[x.id]=f(x.expr,v)});var h="";C.results.forEach(function(r){h+="<div class=\"cr\"><span>"+r.label+"</span><b>"+fmt(f(r.expr,v),r.format)+"</b></div>"});document.getElementById("cr").innerHTML=h}document.querySelectorAll(".calc input").forEach(function(i){i.addEventListener("input",run)});run()})()</script></main>
