<main class="wrap"><article class="art"><span class="lb">계산기</span><h1>복리 계산기</h1><p class="dek">처음 넣은 돈이 해마다 같은 비율로 불어나면 몇 년 뒤 얼마가 되는지 계산합니다.</p><div class="calc"><label for="i_p">처음 넣은 금액 (원)</label><input id="i_p" type="number" inputmode="decimal" step="any" value="10000000"><label for="i_years">기간 (년)</label><input id="i_years" type="number" inputmode="decimal" step="any" value="10"><label for="i_rate">연 수익률 (%)</label><input id="i_rate" type="number" inputmode="decimal" step="any" value="4"></div><div id="cr" class="crs"></div><p class="ad-nt">해마다 한 번 복리로 붙는다고 가정한 참고용 결과입니다. 세금·수수료·수익률 변동은 반영하지 않았습니다.</p></article><script>(function(){var C={"inputs": ["p", "years", "rate"], "vars": [], "results": [{"label": "기간이 끝났을 때 금액", "format": "won", "expr": "p*Math.pow(1+rate/100,years)"}, {"label": "늘어난 금액", "format": "won", "expr": "p*Math.pow(1+rate/100,years)-p"}]};function f(e,x){return new Function("v","with(v){return ("+e+")}")(x)}function fmt(n,k){if(!isFinite(n))return "계산할 수 없음";if(k=="won")return Math.round(n).toLocaleString("ko-KR")+"원";if(k=="pct")return (Math.round(n*100)/100)+"%";return (Math.round(n*100)/100).toLocaleString("ko-KR")}function run(){var v={Math:Math};C.inputs.forEach(function(i){v[i]=parseFloat(document.getElementById("i_"+i).value)||0});C.vars.forEach(function(x){v[x.id]=f(x.expr,v)});var h="";C.results.forEach(function(r){h+="<div class=\"cr\"><span>"+r.label+"</span><b>"+fmt(f(r.expr,v),r.format)+"</b></div>"});document.getElementById("cr").innerHTML=h}document.querySelectorAll(".calc input").forEach(function(i){i.addEventListener("input",run)});run()})()</script></main>
<footer><div class="wrap"><a href="/fact-magazine/demo/tools/privacy/">개인정보 처리방침</a><a href="/fact-magazine/demo/tools/status/">상태</a><p>기사 본문은 싣지 않고 제목·매체·시각·링크만 모아 보여 줍니다. 기사의 저작권은 각 매체에 있습니다.</p></div></footer></body></html>
