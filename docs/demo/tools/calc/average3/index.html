<main class="wrap"><article class="art"><span class="lb">계산기</span><h1>점수 세 개 평균 계산기</h1><p class="dek">점수 세 개의 평균을 구합니다(예시).</p><div class="calc"><label for="i_a">점수 1 (점)</label><input id="i_a" type="number" inputmode="decimal" step="any" value="80"><label for="i_b">점수 2 (점)</label><input id="i_b" type="number" inputmode="decimal" step="any" value="90"><label for="i_c">점수 3 (점)</label><input id="i_c" type="number" inputmode="decimal" step="any" value="70"></div><div id="cr" class="crs"></div><p class="ad-nt">합을 개수로 나눈 값입니다.</p></article><script>(function(){var C={"inputs": ["a", "b", "c"], "vars": [], "results": [{"label": "합", "format": "num", "expr": "a+b+c"}, {"label": "평균", "format": "num", "expr": "(a+b+c)/3"}]};function f(e,x){return new Function("v","with(v){return ("+e+")}")(x)}function fmt(n,k){if(!isFinite(n))return "계산할 수 없음";if(k=="won")return Math.round(n).toLocaleString("ko-KR")+"원";if(k=="pct")return (Math.round(n*100)/100)+"%";return (Math.round(n*100)/100).toLocaleString("ko-KR")}function run(){var v={Math:Math};C.inputs.forEach(function(i){v[i]=parseFloat(document.getElementById("i_"+i).value)||0});C.vars.forEach(function(x){v[x.id]=f(x.expr,v)});var h="";C.results.forEach(function(r){h+="<div class=\"cr\"><span>"+r.label+"</span><b>"+fmt(f(r.expr,v),r.format)+"</b></div>"});document.getElementById("cr").innerHTML=h}document.querySelectorAll(".calc input").forEach(function(i){i.addEventListener("input",run)});run()})()</script></main>
