<main class="wrap"><div class="page"><span class="lb">비교</span><h1>가상 클라우드 노트 요금제 비교</h1><p class="dek">모든 값은 예시 제목 칸을 누르면 정렬됩니다.</p><input id="ft" type="search" placeholder="거르기(글자를 치면 줄이 걸러집니다)" style="font:16px var(--sans);padding:10px;width:100%;border:2px solid #111;margin:0 0 12px"><div style="overflow-x:auto"><table class="mdt" id="tb"><thead><tr><th data-c="0" style="cursor:pointer">요금제 ↕</th><th data-c="1" style="cursor:pointer">월 요금(예시) ↕</th><th data-c="2" style="cursor:pointer">저장 공간 ↕</th><th data-c="3" style="cursor:pointer">사용자 수 ↕</th><th data-c="4" style="cursor:pointer">지원 방식 ↕</th></tr></thead><tbody><tr><td>새싹</td><td>0원</td><td>5GB</td><td>1명</td><td>도움말 문서</td></tr><tr><td>기본</td><td>4,900원</td><td>50GB</td><td>1명</td><td>이메일(영업일 3일 이내)</td></tr><tr><td>가족</td><td>9,900원</td><td>200GB</td><td>최대 5명</td><td>이메일(영업일 2일 이내)</td></tr><tr><td>팀</td><td>19,900원</td><td>1TB</td><td>최대 20명</td><td>채팅·이메일(영업일 1일 이내)</td></tr></tbody></table></div><p class="ad-nt"></p><script>(function(){var t=document.getElementById("tb"),b=t.tBodies[0],f=document.getElementById("ft");t.tHead.querySelectorAll("th").forEach(function(h){h.onclick=function(){var c=+h.dataset.c,asc=h.dataset.a!=="1";h.dataset.a=asc?"1":"0";var r=[].slice.call(b.rows);r.sort(function(x,y){var a=x.cells[c].textContent,z=y.cells[c].textContent,na=parseFloat(a.replace(/,/g,"")),nz=parseFloat(z.replace(/,/g,""));var v=(!isNaN(na)&&!isNaN(nz))?na-nz:a.localeCompare(z,"ko");return asc?v:-v});r.forEach(function(x){b.appendChild(x)})}});f.oninput=function(){var q=f.value.toLowerCase();[].forEach.call(b.rows,function(r){r.style.display=r.textContent.toLowerCase().indexOf(q)>=0?"":"none"})}})()</script></div></main>
