<main class="wrap"><article class="art"><span class="lb">용어 사전</span><h1>기준금리</h1><p class="dek">중앙은행이 정하는 금리로 다른 금리의 기준이 됩니다.</p><p>중앙은행이 경제 상황을 보고 정하는 금리입니다. 은행의 예금·대출 금리가 이를 따라 움직이는 경향이 있습니다. 올리면 대출 이자 부담이 커지고, 내리면 줄어드는 방향으로 영향을 줍니다.</p><h2>함께 보기</h2><ul class="rp"><li><a href="/fact-magazine/demo/tools/glossary/명목금리/">명목금리</a></li><li><a href="/fact-magazine/demo/tools/glossary/실질금리/">실질금리</a></li></ul><div class="by"><a href="/fact-magazine/demo/tools/glossary/">용어 목록</a></div></article></main>
