<main class="wrap"><article class="art"><span class="lb">용어 사전</span><h1>고용률</h1><p class="dek">일할 수 있는 나이의 인구 가운데 취업자의 비율입니다.</p><p>보통 만 15세 이상 인구 대비 취업자 비율이나, 연령 범위를 달리해 15~64세 고용률처럼 따로 발표하기도 합니다. 어떤 연령 범위의 고용률인지 확인해야 숫자를 비교할 수 있습니다.</p><h2>함께 보기</h2><ul class="rp"><li><a href="/fact-magazine/demo/tools/glossary/취업자/">취업자</a></li><li><a href="/fact-magazine/demo/tools/glossary/실업률/">실업률</a></li></ul><div class="by"><a href="/fact-magazine/demo/tools/glossary/">용어 목록</a></div></article></main>
