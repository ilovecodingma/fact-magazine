<main class="wrap"><article class="art"><span class="lb">용어 사전</span><h1>종합소득세</h1><p class="dek">한 해 동안 번 여러 소득을 합쳐 다음 해에 신고하는 세금입니다.</p><p>근로소득·사업소득 등을 합쳐 계산해 정해진 신고 기간에 신고·납부합니다. 직장인은 연말정산으로 대부분 정리되지만 다른 소득이 있으면 따로 신고해야 할 수 있습니다.</p><h2>함께 보기</h2><ul class="rp"><li><a href="/fact-magazine/demo/tools/glossary/원천징수/">원천징수</a></li></ul><div class="by"><a href="/fact-magazine/demo/tools/glossary/">용어 목록</a></div></article></main>
