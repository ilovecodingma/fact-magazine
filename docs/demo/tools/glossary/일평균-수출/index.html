<main class="wrap"><article class="art"><span class="lb">용어 사전</span><h1>일평균 수출</h1><p class="dek">수출액을 조업일수로 나눈 하루 평균 수출액입니다.</p><p>월 초 열흘 같은 짧은 기간끼리 비교할 때 날짜 수(조업일수)가 달라 생기는 착시를 줄이기 위해 씁니다. 총액 증가율과 일평균 증가율이 다르면 조업일수 차이가 원인일 수 있습니다.</p><h2>함께 보기</h2><ul class="rp"><li><a href="/fact-magazine/demo/tools/glossary/무역수지/">무역수지</a></li><li><a href="/fact-magazine/demo/tools/glossary/잠정치/">잠정치</a></li></ul><div class="by"><a href="/fact-magazine/demo/tools/glossary/">용어 목록</a></div></article></main>
